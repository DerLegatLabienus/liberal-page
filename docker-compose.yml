services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liberal_dev
    ports:
      - "5432:5432"
    volumes:
      - liberal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liberal_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  liberal_pgdata:
