services:
  - type: web
    name: liberal-page-api
    runtime: node
    buildCommand: npm ci
    startCommand: npx tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://derlegatlabienus.github.io
      - key: POLL_INTERVAL_MS
        value: "21600000"
      - key: ANTHROPIC_API_KEY
        sync: false
