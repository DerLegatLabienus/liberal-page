name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-smoke:
    name: build + smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liberal_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liberal_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/liberal_dev
        run: npm run smoke
